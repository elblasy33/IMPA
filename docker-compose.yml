services:
  impa-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impa-marine-platform
    restart: unless-stopped
    ports:
      # External host port: 3005 (can be customized via HOST_PORT environment variable)
      - "${HOST_PORT:-3005}:3000"
    volumes:
      # Persistent volume for SQLite database, images, and Odoo CSV exports
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - IMPA_DB_PATH=/app/data/impa_catalog.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
